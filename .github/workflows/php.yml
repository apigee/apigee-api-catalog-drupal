name: test_and_lint
env:
  SIMPLETEST_DB: "sqlite://localhost//tmp/test.sqlite"
  SIMPLETEST_BASE_URL: "http://127.0.0.1:8000"
  BROWSERTEST_OUTPUT_DIRECTORY: "sites/simpletest/browser_output"
  BROWSERTEST_OUTPUT_BASE_URL: ""
  MINK_DRIVER_ARGS_WEBDRIVER: '["chrome", { "chromeOptions": { "w3c": false } }, "http://127.0.0.1:9515/wd/hub"]'

on:
  push:
  pull_request:
  schedule:
    - cron: '30 01 * * *'

jobs:
  build:

    runs-on: ubuntu-24.04
    permissions:
      contents: read

    name: "PHP ${{ matrix.php-version }} | Drupal ${{ matrix.drupal-core }}"
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
        drupal-core:
          - "10.6.x"
          - "11.3.x"
        exclude:
          - php-version: "8.2"
            drupal-core: "11.3.x"
          - php-version: "8.5"
            drupal-core: "10.6.x"

    steps:

    - name: Configure Deprecations Check
      run: |
        if [ "${{ github.event_name }}" = "schedule" ]; then
          echo "Scheduled cron run: Using precision deprecation filters"
          echo "SYMFONY_DEPRECATIONS_HELPER=ignoreFile=./modules/contrib/apigee_api_catalog/.deprecation-ignore.txt" >> $GITHUB_ENV
        else
          echo "Completely disabling deprecation check"
          echo "SYMFONY_DEPRECATIONS_HELPER=disabled" >> $GITHUB_ENV
        fi

    - name: "Install PHP"
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
      with:
        coverage: "xdebug"
        php-version: "${{ matrix.php-version }}"
        tools: composer:v2
        extensions: date, dom, filter, hash, json, curl, libxml, mbstring, zip, pdo, sqlite3, mysqli, mysql, pdo_mysql, bcmath, gd, exif, iconv, opcache, imagick, openssl

    - name: Checkout Drupal core
      run: |
        git clone --depth 1 --branch ${{ matrix.drupal-core }} https://github.com/drupal/drupal.git drupal
        mkdir -p drupal/modules/contrib/apigee_api_catalog
        mkdir -p drupal/sites/simpletest/browser_output
  
    - name: Checkout apigee_api_catalog module
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        path: drupal/modules/contrib/apigee_api_catalog

    - name: Delete lock file
      # Deleting the composer.lock file forces Composer to re-evaluate all dependencies
      # and ensure the latest, secure versions are resolved during the 'composer update' step.
      run: |
        echo "Removing composer.lock to force update latest dependencies."
        rm -f drupal/composer.lock

    - name: "Allow plugins and dev dependencies"
      run: |
        cd drupal
        composer require "justinrainbow/json-schema:^6.5.1" --no-update
        composer config --no-plugins allow-plugins.composer/installers true
        composer config --no-plugins allow-plugins.drupal/core-composer-scaffold true
        composer config --no-plugins allow-plugins.drupal/core-project-message true
        composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
        composer config --no-plugins allow-plugins.wikimedia/composer-merge-plugin true
        composer config --no-plugins allow-plugins.composer/package-versions-deprecated true
        composer config --no-plugins allow-plugins.cweagans/composer-patches true
        composer config --no-plugins allow-plugins.php-http/discovery true
        composer config minimum-stability dev
        composer require wikimedia/composer-merge-plugin
        composer config --json extra.merge-plugin.require '["modules/contrib/apigee_api_catalog/composer.json"]'
        composer config --unset platform.php
        composer config --json extra.patches."drupal/core" '{ "Support entities that are neither content nor config entities": "https://www.drupal.org/files/issues/2020-12-02/3042467-50.patch"}'
        composer update --with-all-dependencies
        composer require --dev phpspec/prophecy-phpunit:^2

    # Install drupal using minimal installation profile and enable the module.
    - name: Install Drupal
      run: |
        cd drupal   
        php -d sendmail_path=$(which true); vendor/bin/drush --yes -v site-install minimal --db-url="$SIMPLETEST_DB"
        vendor/bin/drush rs 8000 &

    - name: "PHPCS"
      run: |
        cd drupal
        cp modules/contrib/apigee_api_catalog/phpcs.xml.dist .
        vendor/bin/phpcs --standard=./phpcs.xml.dist modules/contrib/apigee_api_catalog -p -s -n --colors
        composer show > composer.show.txt

    - name: Artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: composer-${{ matrix.php-version }}-${{ matrix.drupal-core }}-artifact
        path: drupal/composer.*

    - uses: nanasess/setup-chromedriver@ef5c64a93512d266b23b80bae95e46a67f30e703 # v2

    - run: |
        export DISPLAY=:99
        chromedriver --url-base=/wd/hub &
        sudo Xvfb -ac :99 -screen 0 1280x1024x24 > /dev/null 2>&1 & # optional

    - name: "Run PHPUnit Tests"
      if: ${{ matrix.drupal-core != '10.6.x' || matrix.php-version != '8.2' }}
      run: |
        cd drupal
        vendor/bin/phpunit -c core --color --group apigee_api_catalog --testsuite unit,kernel,functional,functional-javascript modules/contrib/apigee_api_catalog

    - name: "Run PHPUnit Tests with Code Coverage"
      if: ${{ matrix.drupal-core == '10.6.x' && matrix.php-version == '8.2' }}
      run: |
        cd drupal
        cp modules/contrib/apigee_api_catalog/phpunit.core.xml.dist core/phpunit.xml
        # Force-disable deprecation checking for codecov test
        SYMFONY_DEPRECATIONS_HELPER=disabled vendor/bin/phpunit -c core --color --group apigee_api_catalog --testsuite unit,kernel,functional,functional-javascript --coverage-clover /tmp/coverage.xml modules/contrib/apigee_api_catalog

    - name: Artifacts
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: browser-output-${{ matrix.php-version }}-${{ matrix.drupal-core }}-artifact
        path: drupal/sites/simpletest/browser_output/*

    - name: Upload Coverage to Codecov
      if: ${{ matrix.drupal-core == '10.6.x' && matrix.php-version == '8.2' }}
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: /tmp/coverage.xml
        name: codecov-umbrella
        fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
        verbose: true
